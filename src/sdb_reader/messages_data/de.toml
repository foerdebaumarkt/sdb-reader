# Die Sätze zu jedem Meldungscode, auf Deutsch.
# {name} steht für eine Angabe der Meldung; eine Liste wird mit Kommas verbunden.
# Eine Meldung, die etwas zählt, kann zwei Sätze tragen: one für genau eins,
# other für jede andere Zahl. [format] date sagt, wie ein Datum geschrieben wird.

