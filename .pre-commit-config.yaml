# Pre-commit baseline
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # Hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files

  # Branch guard: no-commit-to-branch (main)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: ['--branch', 'main']

  # Secrets scanning: gitleaks protect --staged
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Python linting/formatting: ruff + ruff-format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Typing: mypy. The mirror hook brings its own environment; `language:
  # system` needed mypy to be installed already, which it is not on a CI
  # runner -- "Executable `mypy` not found" on every run.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        pass_filenames: false
        language_version: python3.14
        # The type information of the one runtime dependency that ships none.
        additional_dependencies:
          - types-defusedxml==0.7.0.20260504
        args:
          - --config-file=mypy.ini
          - .

  # Code nothing calls. tests/ is deliberately outside the scanned paths,
  # so a function whose only caller is its own test is reported, not hidden.
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.16
    hooks:
      - id: vulture
        # Paths and threshold come from [tool.vulture]; passing changed
        # files instead would hide a symbol whose last caller just went.
        pass_filenames: false

  # The editor-agnostic policy (docs/editor-agnostic.md), enforced. .gitignore
  # already keeps these folders out; this catches the force-added ones and the
  # ones a repo brought along before it adopted the policy, because CI runs
  # pre-commit over every tracked file, not just the changed ones.
  - repo: local
    hooks:
      - id: no-editor-files
        name: no editor-specific files
        language: fail
        entry: >-
          Editor-specific files do not belong in the repository
          (docs/editor-agnostic.md) -- keep them locally and share the
          equivalent Makefile or CLI command instead.
        files: ^\.(vscode|idea)/

  # Regular expressions that take cubic or worse time on a long run of one
  # character (ReDoS), checked where they are written as literals; a pattern
  # put together from pieces at runtime is not seen, and the exponential cases
  # are CodeQL's. regexploit-py prints what it finds and still exits 0, so its
  # report decides here: a finding, a file it cannot parse or a pattern it
  # fails on stops the commit. 1.0.0 is its last release; pinned.
  - repo: local
    hooks:
      - id: regexploit
        name: regexploit (ReDoS)
        language: python
        language_version: python3.14
        additional_dependencies: [regexploit==1.0.0]
        files: ^(src|tools)/.*\.py$
        entry: >-
          bash -c 'report="$(regexploit-py "$@")" || exit 1;
          printf "%s\n" "$report";
          ! grep -qE "^(Vulnerable regex|Bad Python3 syntax|RecursionError|Error finding ReDoS)" <<< "$report"' --
