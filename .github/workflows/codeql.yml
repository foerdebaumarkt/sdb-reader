name: codeql

# Code scanning: CodeQL reads the Python code and the workflows and reports
# what it finds under the repository's Security tab.
#
# Only for a public repository. Code scanning of a private one needs a
# licence the organisation does not hold, and the upload would fail; there
# the job is skipped and reports nothing.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"

permissions: {}

# A newer push to the same pull request makes the older run pointless. Runs
# on main are left to finish: each one is the record for its commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visibility:
    name: Is the repository public?
    # GitHub-hosted only. A public repository must never run on a self-hosted
    # runner: a pull request from a fork would execute its code there.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      public: ${{ steps.ask.outputs.public }}
    steps:
    # Asked of GitHub rather than read from the event: a scheduled run's
    # event does not say.
    - name: Ask GitHub
      id: ask
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
        if [ "$private" = "false" ]; then
          echo "public=true" >> "$GITHUB_OUTPUT"
        else
          echo "public=false" >> "$GITHUB_OUTPUT"
          echo "The repository is private: code scanning is skipped." >> "$GITHUB_STEP_SUMMARY"
        fi

  analyze:
    name: analyze (${{ matrix.language }})
    needs: visibility
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Neither is compiled, so CodeQL reads the files as they are.
        language: [python, actions]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        build-mode: none
    - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: /language:${{ matrix.language }}
