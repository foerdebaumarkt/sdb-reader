# Version updates once a week. A release has to be public for three days
# before it is proposed (cooldown), the same wait [tool.uv] exclude-newer
# holds when the lock is resolved by hand. Minor and patch updates of one
# ecosystem arrive as one pull request; a major stays on its own.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      python-non-major:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 3
    groups:
      actions-non-major:
        update-types: ["minor", "patch"]
