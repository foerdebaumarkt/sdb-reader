[mypy]
# The oldest supported Python (BIB-16).
python_version = 3.12
follow_imports = normal
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
mypy_path = src:.
# A list of bare names for vulture, never imported; every entry is undefined
# by design (ruff.toml ignores F821 there for the same reason).
exclude = (?x)(^build/|^vulture_whitelist\.py$)

show_error_codes = True
pretty = True
strict_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unused_configs = True
check_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_return_any = True

[mypy-tests.*]
# Tests build what they need by hand, a namespace in place of a candidate, a
# pattern they know is there; the library's own code is held to the above.
ignore_errors = True
