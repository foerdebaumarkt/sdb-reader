[pytest]
addopts =
    -q
    # A marker that is not declared below is a typo, not a filter, and a
    # silently ignored one selects nothing.
    --strict-markers
    --strict-config
    # The examples in the package's docstrings are tests: each shows a result,
    # and the result has to be true.
    --doctest-modules
testpaths = tests src/sdb_reader
# Warnings are errors: a DeprecationWarning is the notice for the upgrade that
# breaks. Anything the ecosystem emits that cannot be fixed here is listed by
# name.
filterwarnings =
    error
    # PyMuPDF's SWIG bindings emit this while the C extension is still being
    # imported. Raising there does not fail a test, it segfaults the
    # interpreter, and nothing in this repository can fix the binding.
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
markers =
    real_tesseract: the test asks the installed tesseract itself; every other test gets a stand-in for its version (tests/conftest.py)
    spec: the rules in specs/*.md a test pins, by ID; several allowed (see specs/README.md)
